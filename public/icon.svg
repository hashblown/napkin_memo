<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 원목 테이블 나뭇결 -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.11" numOctaves="3" seed="4"/>
      <feColorMatrix values="0 0 0 0 0.20  0 0 0 0 0.11  0 0 0 0 0.05  0 0 0 -1.1 0.75"/>
    </filter>
    <radialGradient id="light" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#2a160a" flood-opacity="0.45"/>
    </filter>
    <filter id="flapShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-5" dy="-5" stdDeviation="6" flood-color="#5a3b20" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf8ef"/>
      <stop offset="1" stop-color="#efe2c9"/>
    </linearGradient>
    <linearGradient id="flap" x1="1" y1="1" x2="0.2" y2="0.2">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f1e5cf"/>
    </linearGradient>
  </defs>

  <!-- 카페 테이블 -->
  <rect width="512" height="512" fill="#8a5d3b"/>
  <rect width="512" height="512" filter="url(#grain)"/>
  <path d="M0 150 H512 M0 392 H512" stroke="#3b2413" stroke-opacity="0.35" stroke-width="3"/>
  <rect width="512" height="512" fill="url(#light)"/>

  <g transform="translate(256 262) scale(1.16) rotate(-8) translate(-256 -256)">
    <!-- 모서리 하나를 접은 냅킨 -->
    <path d="M120 120 H392 V280 L280 392 H120 Z" fill="url(#body)" filter="url(#lift)"/>
    <path d="M256 124 V388 M124 256 H388" stroke="#e2d2b4" stroke-width="2.5" opacity="0.7"/>
    <path d="M142 142 H370 V270 M270 370 H142 V142" fill="none" stroke="#d8c5a3" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 15"/>

    <!-- 볼펜 낙서: 번뜩이는 전구 -->
    <g fill="none" stroke="#2446a8" stroke-linecap="round" stroke-linejoin="round">
      <!-- 유리구 (두 번 그은 듯 삐뚤게) -->
      <path stroke-width="7" d="M210 270 C188 254 173 231 175 205 C178 168 207 147 239 148 C273 150 299 173 297 207 C295 233 281 251 265 268"/>
      <path stroke-width="3" opacity="0.5" d="M206 266 C186 248 177 226 180 202 C185 170 211 152 242 153 C270 156 293 178 291 209 C289 230 277 247 262 263"/>
      <!-- 필라멘트 -->
      <path stroke-width="5" d="M220 268 L225 238 Q230 226 236 239 Q242 226 248 238 L254 267"/>
      <!-- 목과 소켓 -->
      <path stroke-width="7" d="M211 272 L213 297 M265 269 L262 296"/>
      <path stroke-width="6" d="M205 298 Q236 305 268 296 M208 312 Q236 318 265 310 M216 325 Q237 332 257 323"/>
      <path stroke-width="6" d="M229 336 Q237 342 245 335"/>
      <!-- 반짝 -->
      <path stroke-width="7" d="M238 131 L237 108 M183 150 L167 134 M292 150 L308 133 M160 207 L138 208 M316 207 L338 205"/>
      <!-- 반짝 옆 작은 별 -->
      <path stroke-width="5" d="M330 150 l6 14 l14 3 l-12 7 l2 14 l-10 -9 l-12 5 l6 -13 l-8 -11 l14 1 z"/>
      <!-- 밑줄 휘갈김 -->
      <path stroke-width="5" opacity="0.85" d="M150 356 q12 -12 24 0 t24 0 t22 -2"/>
    </g>

    <!-- 접힌 모서리 -->
    <path d="M392 280 L280 392 L280 280 Z" fill="url(#flap)" filter="url(#flapShadow)"/>
  </g>
</svg>
