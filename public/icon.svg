<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 원목 테이블 나뭇결 -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.11" numOctaves="3" seed="4"/>
      <feColorMatrix values="0 0 0 0 0.20  0 0 0 0 0.11  0 0 0 0 0.05  0 0 0 -1.1 0.75"/>
    </filter>
    <radialGradient id="light" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#2a160a" flood-opacity="0.45"/>
    </filter>
    <filter id="flapShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-5" dy="-5" stdDeviation="6" flood-color="#5a3b20" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf8ef"/>
      <stop offset="1" stop-color="#efe2c9"/>
    </linearGradient>
    <linearGradient id="flap" x1="1" y1="1" x2="0.2" y2="0.2">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f1e5cf"/>
    </linearGradient>
  </defs>

  <!-- 카페 테이블 -->
  <rect width="512" height="512" fill="#8a5d3b"/>
  <rect width="512" height="512" filter="url(#grain)"/>
  <path d="M0 150 H512 M0 392 H512" stroke="#3b2413" stroke-opacity="0.35" stroke-width="3"/>
  <rect width="512" height="512" fill="url(#light)"/>

  <g transform="translate(256 262) scale(1.16) rotate(-8) translate(-256 -256)">
    <!-- 모서리 하나를 접은 냅킨 -->
    <path d="M120 120 H392 V280 L280 392 H120 Z" fill="url(#body)" filter="url(#lift)"/>
    <path d="M256 124 V388 M124 256 H388" stroke="#e2d2b4" stroke-width="2.5" opacity="0.7"/>

    <!-- 볼펜 낙서: 간결한 전구 (냅킨 안쪽 136~310 범위) -->
    <g fill="none" stroke="#2446a8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <!-- 유리구 + 목: 한 획 -->
      <path d="M217 292 C217 275 197 266 189 246 C180 224 185 199 203 186 C222 172 259 173 277 187 C295 201 299 225 291 246 C283 265 264 275 263 292"/>
      <!-- 필라멘트 -->
      <path stroke-width="6" d="M229 291 V272 Q240 254 251 272 V291"/>
      <!-- 소켓 -->
      <path d="M215 305 Q240 311 265 304 M224 320 Q240 325 256 319"/>
      <!-- 반짝 -->
      <path stroke-width="7" d="M240 158 V143 M195 172 L185 162 M285 172 L295 162"/>
    </g>

    <!-- 접힌 모서리 -->
    <path d="M392 280 L280 392 L280 280 Z" fill="url(#flap)" filter="url(#flapShadow)"/>
  </g>
</svg>
